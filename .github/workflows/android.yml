name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --platforms=android --project-name sklad --org kz.sklad .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              text = p.read_text().replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              marker = 'signingConfig = signingConfigs.getByName("debug")'
              if marker not in text:
                  raise RuntimeError("Could not find release signing block")
              text = text.replace(marker, marker + '\n            isMinifyEnabled = false\n            isShrinkResources = false')
              p.write_text(text)
          else:
              raise RuntimeError("Expected Flutter Kotlin Gradle project")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text().replace('android:label="sklad"', 'android:label="Склад"')
          source = source.replace('<application', '<uses-permission android:name="android.permission.CAMERA"/>\n    <application', 1)
          manifest.write_text(source)
          PY
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify that APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sklad-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish test APK in GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Sklad-Inventory-v0.2.0.apk
          tag="v0.2.0-inventory"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Склад 0.2.0 · Инвентаризация" --notes "Тестовая Android-версия: QR, Code 128, сканирование заводских кодов, карточки товаров, движение остатков, пересчёт, CSV и резервные копии JSON."
          gh release upload "$tag" Sklad-Inventory-v0.2.0.apk --clobber

