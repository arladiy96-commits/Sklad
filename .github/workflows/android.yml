name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --platforms=android --project-name sklad --org kz.sklad .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              text=p.read_text().replace("minSdk = flutter.minSdkVersion","minSdk = 24")
              p.write_text(text)
          else:
              p=Path("android/app/build.gradle")
              text=p.read_text().replace("minSdkVersion flutter.minSdkVersion","minSdkVersion 24")
              p.write_text(text)
          Path("android/app/proguard-rules.pro").write_text(
              "-dontwarn com.google.mlkit.vision.text.chinese.**\\n"
              "-dontwarn com.google.mlkit.vision.text.devanagari.**\\n"
              "-dontwarn com.google.mlkit.vision.text.japanese.**\\n"
              "-dontwarn com.google.mlkit.vision.text.korean.**\\n"
          )
          PY
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Sklad-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
