name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --platforms=android --project-name sklad --org kz.sklad .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              text = p.read_text().replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              marker = 'signingConfig = signingConfigs.getByName("debug")'
              if marker not in text:
                  raise RuntimeError("Could not find release signing block")
              text = text.replace(marker, marker + '\n            proguardFiles("proguard-rules.pro")')
              p.write_text(text)
          else:
              raise RuntimeError("Expected Flutter Kotlin Gradle project")
          Path("android/app/proguard-rules.pro").write_text("\n".join([
              "-dontwarn com.google.mlkit.vision.text.chinese.**",
              "-dontwarn com.google.mlkit.vision.text.devanagari.**",
              "-dontwarn com.google.mlkit.vision.text.japanese.**",
              "-dontwarn com.google.mlkit.vision.text.korean.**"
          ]) + "\n")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest.write_text(manifest.read_text().replace('android:label="sklad"', 'android:label="Склад"'))
          PY
      - name: Remove generated template test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Sklad-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
